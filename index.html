  for (const t of ticks) {
    svg.append(s('line', { x1: pad.l, x2: W - pad.r, y1: Y(t), y2: Y(t), stroke: t === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': t === 0 ? 1.5 : 1 }));
    const tx = s('text', { x: pad.l - 8, y: Y(t) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)' });
    tx.textContent = compactYen(t); svg.append(tx);
  }
  const nx = Math.min(6, dates.length);
  for (let k = 0; k < nx; k++) {
    const i = nx === 1 ? 0 : Math.round(k * (dates.length - 1) / (nx - 1));
    const tx = s('text', { x: X(i), y: H - 8, 'text-anchor': k === 0 ? 'start' : k === nx - 1 ? 'end' : 'middle', 'font-size': 11, fill: 'var(--muted)' });
    tx.textContent = dates[i].slice(5).replace('-', '/'); svg.append(tx);
  }
  for (const se of series) {
    const d = se.values.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    svg.append(s('path', { d, fill: 'none', stroke: color(se.key), 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': isCtrl(se.key) ? '5 4' : 'none' }));
  }
  if (direct) {
    const ends = series.map(se => ({ se, y: Y(se.values[se.values.length - 1]) })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 15) ends[i].y = ends[i - 1].y + 15;
    for (const e of ends) {
      const xe = X(dates.length - 1);
      svg.append(s('circle', { cx: xe, cy: Y(e.se.values[e.se.values.length - 1]), r: 3.5, fill: color(e.se.key), stroke: 'var(--surface)', 'stroke-width': 2 }));
      const t = s('text', { x: xe + 10, y: e.y + 4, 'font-size': 11, fill: 'var(--ink-2)' });
      t.textContent = e.se.label.replace(/（.*）/, ''); svg.append(t);
    }
  }
  const cross = s('line', { y1: pad.t, y2: H - pad.b, stroke: 'var(--axis)', 'stroke-width': 1, opacity: 0 });
  svg.append(cross);
  const dots = series.map(se => { const c = s('circle', { r: 4, fill: color(se.key), stroke: 'var(--surface)', 'stroke-width': 2, opacity: 0 }); svg.append(c); return c; });
  const tip = el('div', { class: 'tip' });
  host.replaceChildren(svg, tip);
  let cur = dates.length - 1;
  const show = i => {
    cur = Math.max(0, Math.min(dates.length - 1, i));
    const x = X(cur);
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', 1);
    series.forEach((se, k) => { dots[k].setAttribute('cx', x); dots[k].setAttribute('cy', Y(se.values[cur])); dots[k].setAttribute('opacity', 1); });
    const rows = series.map(se => ({ se, v: se.values[cur] })).sort((a, b) => b.v - a.v);
    tip.replaceChildren(el('div', { class: 'd' }, dates[cur]),
      ...rows.map(r => el('div', { class: 'row' }, keyMark(r.se.key), el('b', {}, signedYen(r.v)), el('span', {}, r.se.label))));
    tip.style.opacity = 1;
    const tw = tip.offsetWidth, left = x + 14 + tw > W ? x - 14 - tw : x + 14;
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = '8px';
  };
  const hide = () => { cross.setAttribute('opacity', 0); dots.forEach(d => d.setAttribute('opacity', 0)); tip.style.opacity = 0; };
  svg.addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    show(Math.round((px - pad.l) / (W - pad.l - pad.r) * (dates.length - 1)));
  });
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('focus', () => show(cur));
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft') { show(cur - 1); ev.preventDefault(); }
    if (ev.key === 'ArrowRight') { show(cur + 1); ev.preventDefault(); }
  });
}

function monthlyPanel(m) {
  const months = [...new Set(m.monthly.map(r => r.month))].sort().reverse();
  const keys = m.strategies.map(s => s.key);
  const cell = new Map(m.monthly.map(r => [r.month + '|' + r.key, r]));
  const thead = el('tr', {}, el('th', {}, '月'), ...m.strategies.map(s => el('th', {}, s.label)));
  const rows = months.map(mo => el('tr', {}, el('td', {}, mo.replace('-', '年') + '月'), ...keys.map(k => {
    const r = cell.get(mo + '|' + k);
    if (!r) return el('td', {}, '—');
    const up = r.profit >= 0;
    return el('td', {}, el('span', { class: up ? 'up' : 'down' }, `${up ? '▲' : '▼'} ${r.roi}%`), el('br'),
      el('small', { style: 'color:var(--muted)' }, signedYen(r.profit)));
  })));
  return el('section', { class: 'panel' }, el('h2', {}, '月ごとの回収率'),
    el('p', { class: 'sub' }, '100%を超えた月が黒字（▲）。'),
    el('div', { class: 'tablewrap' }, el('table', {}, el('thead', {}, thead), el('tbody', {}, ...rows))));
}

function recentPanel(m) {
  const label = { hit: '的中', miss: 'はずれ', refund: '返還', pending: '結果待ち' };
  const thead = el('tr', {}, ...['レース', '戦略', '買い目', 'AIの予測', '結果', '払戻'].map(h => el('th', {}, h)));
  const rows = m.recent.map(r => el('tr', {},
    el('td', {}, r.race),
    el('td', { class: 'l' }, el('span', { style: 'display:inline-flex;align-items:center;gap:6px' }, keyMark(r.key), r.strategy)),
    el('td', { class: 'l' }, r.bet), el('td', {}, r.prob == null ? '—' : r.prob + '%'),
    el('td', { class: 'st-' + r.status }, label[r.status] || r.status),
    el('td', {}, r.payout == null ? '—' : yen(r.payout))));
  return el('section', { class: 'panel' }, el('h2', {}, '最近の買い目'),
    el('p', { class: 'sub' }, '新しい順に40件。「AIの予測」はAIが見積もった、その買い目が当たる確率（比較用の買い方には出しません）。'),
    el('div', { class: 'tablewrap' }, el('table', {}, el('thead', {}, thead), el('tbody', {}, ...rows))));
}

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawChart, 120); });
render();
</script>
